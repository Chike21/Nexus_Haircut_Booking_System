{% extends "base.html" %}
{% load static %}
{% block content %}

<!-- Login Form Start -->
          {% if messages %}
            {% for message in messages %}
            <div class="alert alert-success alert-dismissible fade show" role="alert">
            {{ message }}
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="alert">
              </button>
            </div>
           {% endfor %}
          {% endif %}
<div class="container-xxl py-5">
    <div class="container  rounded">

        <div class="text-center mb-5">
            <h1 class="text-uppercase">Login To Your Account 💈</h1>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-6  rounded">

                <div class="bg-secondary p-5 login-box shadow">

                    <form method="POST">
                        {% csrf_token %}

                        <div class="row g-3">

                            <!-- Username -->
                            <div class="col-12">
                                <div class="form-floating">
                                    <input
                                        type="text"
                                        name="username"
                                        class="form-control bg-transparent"
                                        placeholder="Username"
                                        required
                                    >
                                    <label>Username</label>
                                </div>
                            </div>

                            <!-- Password -->
                            <div class="col-12">
                                <div class="form-floating input-group">

                                    <input type="password"
                                        id="loginPassword"
                                        name="password"
                                        class="form-control bg-transparent"
                                        placeholder="Password"
                                        required
                                    >

                                    <button
                                        class="btn btn-outline-secondary"
                                        type="button"
                                        onclick="togglePassword('loginPassword')"
                                    >
                                        👁️
                                    </button>

                                    <label>Password</label>

                                </div>
                            </div>

                            <!-- Forgot Password -->
                            <div class="col-12 text-end">
                                <a href="#" class="text-primary small">
                                    Forgot Password?
                                </a>
                            </div>

                            <!-- Submit -->
                            <div class="col-12 mt-3">
                                <button
                                    class="btn btn-primary w-100 py-3 rounded-pill"
                                    type="submit"
                                >
                                    Login
                                </button>
                            </div>

                            <!-- Register -->
                            <div class="col-12 text-center mt-3">
                                <p>
                                    Don’t have an account?
                                    <a href="{% url 'signup' %}" class="text-primary">
                                        Register now
                                    </a>
                                </p>
                            </div>

                        </div>
                    </form>

                </div>

            </div>
        </div>

    </div>
</div>
<!-- Login Form End -->

{% endblock %}
